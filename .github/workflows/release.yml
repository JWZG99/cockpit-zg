# Builds the Windows installer whenever the version in package.json changes on main and publishes it as a
# GitHub release (tag vX.Y.Z); the installed program finds the release and updates itself.
name: Windows-Version bauen
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python build/web-zu-app.py
      - run: npm run dist
      - name: Release veröffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist
          VER=$(node -p "require('./package.json').version")
          shopt -s nullglob
          FILES=(dist/*.exe dist/*.exe.blockmap dist/latest.yml)
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" "${FILES[@]}" --clobber
          else
            gh release create "v$VER" "${FILES[@]}" --title "Cockpit ZG $VER" --notes "Neue Version von Cockpit ZG." --target "$GITHUB_SHA"
          fi
