<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Cockpit ZG</title>
<style>
:root { --bg: #f2f2f7; --text: #1c1c1e; --muted: #6c6c70; --accent: #0068da; }
@media (prefers-color-scheme: dark) { :root { --bg: #000; --text: #f2f2f7; --muted: #98989f; --accent: #0a84ff; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background-image: radial-gradient(900px 600px at 10% 0%, rgba(0,104,218,.12), transparent 60%), radial-gradient(800px 600px at 100% 100%, rgba(52,199,89,.10), transparent 60%); }
.box { text-align: center; width: min(380px, 90vw); }
h1 { margin: 0 0 18px; font-size: 30px; letter-spacing: -.02em; }
.ring { width: 34px; height: 34px; margin: 0 auto 18px; border-radius: 50%; border: 3px solid rgba(127,127,127,.25); border-top-color: var(--accent); animation: d 0.9s linear infinite; }
@keyframes d { to { transform: rotate(360deg); } }
#t { color: var(--muted); min-height: 1.4em; }
.bar { height: 5px; border-radius: 3px; background: rgba(127,127,127,.25); margin: 14px auto 0; width: 220px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
</style>
</head>
<body>
<main class="box" aria-live="polite">
  <h1>Cockpit ZG</h1>
  <div class="ring" aria-hidden="true"></div>
  <div id="t">Wird gestartet …</div>
  <div class="bar" id="bar" hidden><i id="bi"></i></div>
</main>
<script>
(() => {
  const N = window.native; if (!N || !N.onAktivitaet) return;
  const zeig = (a) => {
    if (!a) return;
    document.getElementById('t').textContent = a.t;
    document.getElementById('bar').hidden = a.pct == null;
    if (a.pct != null) document.getElementById('bi').style.width = a.pct + '%';
  };
  N.onAktivitaet(zeig); N.aktivitaet().then(zeig);
})();
</script>
</body>
</html>
